<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Form</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header>
        <h1>The Great Big Website</h1>
        <nav></nav>
    </header>
    <main>
        <div id="message"></div>
        <form action="formprocessing.html" method="get" id="myform">
           <fieldset>
                <legend>New Account</legend>
                
                <div class="form-row">
                    <label for="personname">Full Name</label>
                    <input id="personname" type="text" name="fullname" placeholder="Full Name">
                </div>
                
                
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" placeholder="Email">
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" name="pass" id="password" placeholder="Password">
                </div>
        


                <div class="form-row">
                    <div class="spacer"></div>
                    <input type="submit">
                </div>



                <div class="check-row">
                    <div class="spacer"></div>

                    <input type="radio" id="html" name="favoritelanguage" checked>
                    <label for="html">HTML</label>

                    <input type="radio" id="css" name="favoritelanguage">
                    <label for="css">CSS</label>

                    <input type="radio" id="javascript" name="favoritelanguage">
                    <label for="javascript">JavaScript</label>
                </div>
                <br>
                <div>
                    <label for="paragraph">This is textarea:</label>
                    <textarea id="paragraph" name="paragraph" rows="4" cols="50" placeholder="Text Text Text"></textarea>
                </div>
                <div>
                    <label for="options">Select box:</label>
                    <select name="options" id="options">
                        <option value="volvo">Big Mac</option>
                        <option value="saab">Whopper</option>
                        <option value="mercedes" selected>Taco</option>
                        <option value="audi">Pizza</option>
                    </select>
                </div>
                <div>
                    <input type="checkbox" id="checkbox" name="newsletter" value="yes">
                    <label for="checkbox">Click this button (checkbox)</label>
                </div>
                <br>
                <div class="url">
                    <p>Enter your favorite url:</p>
                    <input type="url" placeholder="example.com" />
                </div>
                <br>
                <div>
                    <p>Give us your number</p>
                    <input type="tel" placeholder="808-***-****" />
                </div>
            </fieldset>
        </form>
    </main>
    <footer>&copy; 2026 Jojojojo</footer>
    
    <script src="formprocessing.js"></script>
    
</body>
</html>
